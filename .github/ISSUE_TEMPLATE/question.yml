name: ❓ 使用咨询
description: 咨询 ContiNew Admin 的使用或设计相关问题
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前建议先查阅[使用指南](https://continew.top/docs/admin/guide/quick-start.html)并询问 [DeepWiki](https://deepwiki.com/continew-org/continew-admin)，多数使用问题都能快速找到答案。

        > 前端相关问题请提交至 [continew-admin-ui](https://github.com/continew-org/continew-admin-ui) 仓库；依赖组件自身的问题（如 MyBatis-Plus、Sa-Token 等）请提交至对应组件仓库。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这是使用咨询而非 Bug 报告（Bug 请使用 Bug 报告模板）
          required: true
        - label: 我确认已搜索 Issue 广场，没有类似问题
          required: true
        - label: 我确认这是 ContiNew Admin 自身的问题，而非前端项目或依赖组件的问题
          required: true
  - type: input
    id: version
    attributes:
      label: ContiNew Admin 版本
      placeholder: 例如：4.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 详细描述你的问题，请提供尽可能多的上下文信息。
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已尝试的方法
      description: 描述你已经尝试过的排查或解决方案。
    validations:
      required: false
