name: Deploy

on:
  # 推送时执行
  push:
    branches: [dev]
  # 可手动执行
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Dry-Run：仅输出路由决策，不执行任何构建/部署动作'
        type: boolean
        default: false
      simulate_paths:
        description: 'simulate=true 时的模拟改动路径清单（空格或换行分隔）；simulate=false 时传入将使工作流失败'
        type: string
        default: ''
      deploy_target:
        description: '手动部署目标（仅 workflow_dispatch 生效，push 触发忽略）：不选则按改动分流'
        type: choice
        options:
          - auto
          - ui
          - backend
          - both
        default: auto

permissions:
  contents: read

# 部署不可中途取消（避免容器重建被打断），连续触发时排队执行
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changes
    # repo 守卫（同 ci.yml 的 Sonar analysis）：fork 上手动触发不执行任何作业
    if: github.repository == 'continew-org/continew-admin'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      deploy_backend: ${{ steps.changes.outputs.deploy_backend }}
      categories: ${{ steps.changes.outputs.categories }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 改动检测需要 base/before 提交对象参与 diff，取完整历史
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        env:
          SIMULATE: ${{ inputs.simulate }}
          SIMULATE_PATHS: ${{ inputs.simulate_paths }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
        # 工作流级不做任何 paths 过滤：>300 文件时 GitHub 会跳过 paths 匹配，
        # 部署分流必须由 job 级 diff 判定完成（scripts/ci/changed-files.sh -> detect-changes.sh）；
        # simulate 清单仅在 Dry-Run 时替代 diff；simulate=false 时传 simulate_paths
        # 属歧义输入，直接快速失败。
        # deploy_target 用于手动指定部署范围：workflow_dispatch 没有 diff 基线，
        # changed-files.sh 会降级成全类别放行（连带重建后端），指定目标即可避开
        run: |
          set -eo pipefail
          target=${DEPLOY_TARGET:-auto}

          if [ "$target" != 'auto' ] && [ -n "$SIMULATE_PATHS" ]; then
            echo '::error::deploy_target 与 simulate_paths 不能同时使用：手动指定部署目标时不需要模拟改动清单'
            exit 1
          fi
          if [ -n "$SIMULATE_PATHS" ] && [ "$SIMULATE" != 'true' ]; then
            echo '::error::simulate_paths 仅在 simulate=true 时可用'
            exit 1
          fi

          if [ "$target" != 'auto' ]; then
            # 手动指定目标：不解析 diff，直接给出分流结论。
            # push 触发时 inputs.deploy_target 为空，落到下方 auto 分支，原逻辑不受影响
            case "$target" in
              ui)
                ui=true; deploy_backend=false ;;
              backend)
                ui=false; deploy_backend=true ;;
              both)
                ui=true; deploy_backend=true ;;
              *)
                echo "::error::未知的 deploy_target：$target"
                exit 1
                ;;
            esac
            {
              echo "ui=$ui"
              echo "deploy_backend=$deploy_backend"
              echo "categories=manual-$target"
            } >> "$GITHUB_OUTPUT"
          elif [ -n "$SIMULATE_PATHS" ]; then
            printf '%s\n' "$SIMULATE_PATHS" | tr ' \t' '\n' | sed '/^$/d' | bash scripts/ci/detect-changes.sh >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch 未传模拟清单：simulate=true 时构建/部署动作由各作业
            # if 的 simulate 守卫拦截（仅出路由决策），simulate=false 即正常部署；
            # push/dispatch 的清单解析与兜底在编排层 scripts/ci/changed-files.sh
            bash scripts/ci/changed-files.sh >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Server
    needs: detect
    # simulate Dry-Run 下，所有触达 secrets/容器/部署目录的作业一律不执行（作业级守卫）
    if: >-
      github.repository == 'continew-org/continew-admin'
      && inputs.simulate != true
      && needs.detect.outputs.deploy_backend == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # 1、检出源码
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 2、打包（容器内构建：mvnw/pom 插件/注解处理器等构建期代码不触达宿主机，
      #    不挂 docker.sock、不注入 job secrets；/root/.m2 挂载复用依赖缓存）。
      #    镜像按 digest 固定（对应 3.9-eclipse-temurin-25 标签，即 runner 当前实跑
      #    版本），升级时显式更换
      - name: Build Server
        run: >
          docker run --rm
          --memory=6g --cpus=4
          -v "$PWD":/ws -v /root/.m2:/root/.m2 -w /ws
          maven@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
          ./mvnw -B package
      # 3、同步到服务器部署目录（runner 与部署机同机，本地 rsync 即可）
      #    lib/ 与 bin/ 为纯构建产物，用 --delete 清理升级后遗留的旧依赖/旧 jar，
      #    防止宿主 lib/ 堆积导致 classpath 多版本共存（如 snail-job 三代同存）；
      #    config/ 来自构建产物普通同步；Dockerfile 不属于构建产物（在仓库 docker/ 下），
      #    单独从源码同步，保证 docker-compose --build 的构建上下文完整且不依赖历史遗留。
      - name: Copy
        run: |
          rsync -a --delete continew-server/target/app/lib/ ${{ secrets.SERVER_PATH }}/continew-admin/lib/
          rsync -a --delete continew-server/target/app/bin/ ${{ secrets.SERVER_PATH }}/continew-admin/bin/
          rsync -a continew-server/target/app/config/ ${{ secrets.SERVER_PATH }}/continew-admin/config/
          rsync -a docker/continew-admin/Dockerfile ${{ secrets.SERVER_PATH }}/continew-admin/Dockerfile
      # 4、启动
      - name: Start
        run: |
          cd ${{ secrets.SERVER_PATH }}
          docker-compose up --force-recreate --build -d continew-server
          docker images | grep none | awk '{print $3}' | xargs -r docker rmi

  package-ui:
    name: Build UI artifact
    needs: detect
    if: >-
      github.repository == 'continew-org/continew-admin'
      && inputs.simulate != true
      && needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: continew-ui
    outputs:
      artifact_id: ${{ steps.upload-dist.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enable corepack and pin pnpm
        # setup-node 从仓库根目录探测 pnpm store，须先用项目的版本覆盖 Corepack 默认版本。
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          corepack install -g "$(node -p "require('./package.json').packageManager")"
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: continew-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI
        env:
          # 未配置时不注入统计脚本；VITE_* 会写入公开产物。
          VITE_BAIDU_ANALYTICS_ID: ${{ secrets.BAIDU_ANALYTICS_ID }}
        run: pnpm build
      - name: Upload dist artifact
        id: upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # 同一个 run 全量重跑时，不覆盖前一次构建的产物。
          name: continew-ui-dist-${{ github.run_attempt }}
          path: continew-ui/dist/
          if-no-files-found: error
          retention-days: 14

  build-ui:
    name: Deploy UI
    needs: [detect, package-ui]
    if: >-
      github.repository == 'continew-org/continew-admin'
      && inputs.simulate != true
      && needs.detect.outputs.ui == 'true'
      && needs.package-ui.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Prepare artifact directory
        id: ui-dist
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.package-ui.outputs.artifact_id }}
        run: |
          # 空 ID 会让下载 Action 退回全量下载；没有精确 ID 时禁止发布。
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::构建未返回有效的 UI artifact ID，已中止发布'
            exit 1
          fi
          artifact_dir=$(mktemp -d -- "$RUNNER_TEMP/continew-ui-dist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXXXX")
          # rsync -a 会同步源根目录权限；只同步 0755 子目录，临时父目录保持私有。
          mkdir -m 0755 -- "$artifact_dir/dist"
          printf 'path=%s\n' "$artifact_dir/dist" >> "$GITHUB_OUTPUT"
      - name: Download exact UI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # 不传 token 或 run-id：仅从当前 Deploy run 按 ID 读取，失败重跑可沿用成功构建的 ID。
          artifact-ids: ${{ needs.package-ui.outputs.artifact_id }}
          path: ${{ steps.ui-dist.outputs.path }}
          digest-mismatch: error
      # 发布到演示站点：快照上一版 -> 落新资源 -> 切换入口 -> 清理上一版残留 -> 自检
      - name: Publish UI dist
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          UI_DIST: ${{ steps.ui-dist.outputs.path }}
        run: |
          set -euo pipefail
          [ -f "$UI_DIST/index.html" ] && [ -d "$UI_DIST/assets" ] || {
            echo '::error::UI artifact 缺少 index.html 或 assets/，已中止发布'
            exit 1
          }
          # secret 可能写成未展开的 ~/...，引号内的波浪号不会展开
          SERVER_PATH="${SERVER_PATH/#\~/$HOME}"
          WEB_DIR="$SERVER_PATH/continew-admin/web"
          SNAP_ROOT="$SERVER_PATH/backups/web"
          SNAP="$SNAP_ROOT/web-$(date -u +%Y%m%dT%H%M%SZ)"

          # 写入前先确认真实目录：软链会被容器按 inode 挂载，写进去容器看不到
          [ -d "$WEB_DIR" ] && [ ! -L "$WEB_DIR" ] || {
            echo "::error::$WEB_DIR 不存在或不是真实目录（不得为软链），已中止发布"
            exit 1
          }
          case "$SNAP_ROOT" in
            */backups/web) ;;
            *) echo "::error::快照根目录异常：$SNAP_ROOT"; exit 1 ;;
          esac

          mkdir -p "$SNAP_ROOT"
          # 1、快照上一版。快照必须落在 web/ 之外，放在里面会被第 4 步的 --delete 清掉
          rsync -a --delete "$WEB_DIR/" "$SNAP/"
          echo "快照：$SNAP（$(du -sh "$SNAP" | cut -f1)）" >> "$GITHUB_STEP_SUMMARY"

          # 2、落新资源：排除 index.html。入口引用的 chunk 必须先全部到位
          rsync -a --exclude '/index.html' "$UI_DIST/" "$WEB_DIR/"

          # 3、切换入口：单独传 index.html，此时它引用的资源已全部落盘
          rsync -a "$UI_DIST/index.html" "$WEB_DIR/index.html"

          # 4、清理上一版残留：此时 index.html 已指向新资源
          rsync -a --delete "$UI_DIST/" "$WEB_DIR/"

          # 5、只轮转本步骤生成的命名（web-<14 位时间戳>Z），手工建的基线快照不参与
          mapfile -t snaps < <(find "$SNAP_ROOT" -maxdepth 1 -mindepth 1 -type d \
            -regextype posix-extended -regex '.*/web-[0-9]{8}T[0-9]{6}Z' \
            -printf '%f\n' | sort -r)
          if [ "${#snaps[@]}" -gt 3 ]; then
            for old in "${snaps[@]:3}"; do
              echo "- 清理旧快照：$old" >> "$GITHUB_STEP_SUMMARY"
              rm -rf "$SNAP_ROOT/$old"
            done
          fi
          echo "- 保留快照：$(find "$SNAP_ROOT" -maxdepth 1 -mindepth 1 -type d -name 'web-*' -printf '%f\n' | sort -r | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      # 发布后自检：逐项确认入口与它引用的资源都在位
      - name: Verify published site
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          SERVER_PATH="${SERVER_PATH/#\~/$HOME}"
          WEB_DIR="$SERVER_PATH/continew-admin/web"
          test -f "$WEB_DIR/index.html"
          test -d "$WEB_DIR/assets"
          test "$(grep -c 'id="root"' "$WEB_DIR/index.html")" = '1'

          # 逐项校验 index.html 的本地引用。SPA 的 try_files 会把缺失资源回落成
          # 200 + index.html，只看 HTTP 状态判不出资源缺失
          missing=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if [ ! -f "$WEB_DIR$ref" ]; then
              echo "::error::index.html 引用的资源缺失：$ref"
              missing=$((missing + 1))
            fi
          done < <(grep -oE '(src|href)="/[^"]+"' "$WEB_DIR/index.html" \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | grep -vE '^(https?:)?//' | sort -u)
          [ "$missing" -eq 0 ] || { echo "::error::缺失 $missing 个资源，发布未完成"; exit 1; }

          echo "- index.html bytes=$(stat -c%s "$WEB_DIR/index.html") assets=$(find "$WEB_DIR/assets" -maxdepth 1 -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

  decision:
    name: Deploy routing decision
    needs: detect
    # detect 成功即出决策日志（含部署作业被分流跳过的情形）；detect 失败时工作流已红，无需留档
    if: >-
      always()
      && github.repository == 'continew-org/continew-admin'
      && needs.detect.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write routing decision
        env:
          SIMULATE: ${{ inputs.simulate }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          UI: ${{ needs.detect.outputs.ui }}
          DEPLOY_BACKEND: ${{ needs.detect.outputs.deploy_backend }}
          CATEGORIES: ${{ needs.detect.outputs.categories }}
        # 纯文档/infra-only 变更时部署作业中性 Skipped，决策依据在此留档
        run: |
          backend_action='跳过'
          [ "$DEPLOY_BACKEND" = 'true' ] && backend_action='执行'
          ui_action='跳过'
          [ "$UI" = 'true' ] && ui_action='执行'
          mode='真实'
          [ "$SIMULATE" = 'true' ] && mode='Dry-Run（simulate）：以下为模拟路由，未执行任何构建/部署动作'
          target_note='按改动分流'
          [ -n "$DEPLOY_TARGET" ] && [ "$DEPLOY_TARGET" != 'auto' ] && target_note="手动指定（$DEPLOY_TARGET）"
          {
            echo '## 部署分流决策'
            echo "- 模式：$mode"
            echo "- 分流依据：$target_note"
            echo "- 改动类别：$CATEGORIES"
            echo "- 后端部署（Deploy Server）：$backend_action"
            echo "- UI 构建与发布（Deploy UI）：$ui_action"
          } >> "$GITHUB_STEP_SUMMARY"
