name: PR Validation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

# 同 PR 新事件串行执行：并发 run 会同时查无历史评论并各自 create，产生重复评论；
# 不用 cancel-in-progress，取消会让 required check 落在 cancelled 结论上反而阻塞合并
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            common
            system
            server
            plugin
            auth
            open
            tenant
            schedule
            docker
            ui
          requireScope: false
          # 本项目采用 Squash and merge，PR 标题即最终提交信息（见 CONTRIBUTING.md），
          # 单提交的原始提交信息合并后不保留，无需按标题规则校验或与标题对齐
          validateSingleCommit: false
          validateSingleCommitMatchesPrTitle: false

  check-commit-authors:
    # 各触发类型一律执行，不按事件过滤：edited 时跳过会产生 skipped check
    # 覆盖既有 failure（GitHub 按最新一次 check 判定），且 edited 也包含改 base 分支
    name: Verify commit author emails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check commit authors linked to GitHub
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // 全量分页：单页 100 条会漏检长 PR
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const unlinked = commits.filter(c => !c.author);
            if (unlinked.length === 0) {
              core.info('所有提交的作者邮箱均已绑定 GitHub 账号。');
              return;
            }

            const details = unlinked.map(c =>
              `| \`${c.sha.slice(0, 7)}\` | ${c.commit.author.name} | ${c.commit.author.email} |`
            ).join('\n');

            const body = [
              '### ⚠️ 提交作者校验未通过',
              '',
              '以下提交的作者邮箱**未绑定任何 GitHub 账号**，',
              '这将导致 CLA 无法签署，进而阻塞 PR 合并。',
              '',
              '| 提交 | 作者 | 邮箱 |',
              '|:-----|:-----|:-----|',
              details,
              '',
              '**修复方式：**',
              '1. 将该邮箱添加到你的 GitHub 账号：https://github.com/settings/emails',
              '2. 或将本地 git 配置改为已绑定 GitHub 的邮箱：',
              '   ```',
              '   git config user.name "你的 GitHub 用户名"',
              '   git config user.email "your-github-email@example.com"',
              '   ```',
              '3. 修订提交并强推：',
              '   ```',
              '   git rebase -i HEAD~' + commits.length + ' # 将未绑定邮箱的提交标记为 "edit"，修改作者信息后 continue',
              '   git push --force-with-lease',
              '   ```',
              '',
              '*推送后本校验会自动重新运行。*',
            ].join('\n');

            // 用固定标记定位历史评论做更新，避免每次推送都新增一条
            const marker = '<!-- pr-validation-author-check -->';
            const commentBody = marker + '\n' + body;
            const existingComments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });
            const existing = existingComments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

            core.setFailed(
              `${unlinked.length} 个提交的作者邮箱未绑定 GitHub 账号，修复方式见 PR 评论。`
            );
