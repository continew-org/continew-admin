name: API Test (L3)

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

# 每个 PR 独立并发组：同 PR 新 push 取消旧 run，不同 PR 互不阻塞。
concurrency:
  group: api-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 改动检测需要 base 提交对象参与 diff，取完整历史
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        # 本工作流仅 pull_request 触发；工作流级不做任何 paths 过滤，
        # 检查分流由 job 级 diff 判定完成（scripts/ci/changed-files.sh -> detect-changes.sh）
        run: bash scripts/ci/changed-files.sh >> "$GITHUB_OUTPUT"

  l3:
    name: L3 API black-box
    needs: detect
    # 纯 UI / 纯文档 PR 上中性 Skipped，必需检查（分支保护登记名）不悬空
    if: needs.detect.outputs.backend == 'true'
    # 托管 runner：自带 Docker 与 JDK 25，且天然覆盖 fork PR。
    # L3 仅用仓库内公开弱凭据、无 secret、无写权限，fork 运行无安全风险。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove repository mirrors
        # 与 ci.yml / sonar.yml 同形：托管 runner 上国内镜像不稳定，改用 Maven Central。
        # 必须在 setup-java 之前执行：Maven 缓存键按此刻磁盘上的 POM 内容计算
        # （**/pom.xml 参与 hashFiles），缺这一步会算出与 dev 写入方不同的键，
        # 精确键永不命中，每次全量冷下载依赖（setup-java 未设 restore-keys 兜底）
        run: |
          sed -i.bak '/<repositories>/,/<\/repositories>/d' pom.xml
          sed -i.bak '/<pluginRepositories>/,/<\/pluginRepositories>/d' pom.xml

      - name: Set up JDK 25
        # 与 ci.yml 同 pinned 版本；构建基线 JDK 25，产物字节码 17。
        # 瘦包由 up.sh 内的 ./mvnw package 现构建，运行时镜像自带 JRE 17。
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          # 本工作流只由 pull_request 触发，缓存一律只读；写入方只有 dev 上的 Backend checks / Sonar analysis
          cache-read-only: true

      - name: Start test environment
        # up.sh：探测空闲端口 -> mvnw package 瘦包 -> compose 启 MySQL/Redis/应用 -> 健康检查 -> 关闭验证码
        run: bash scripts/test/up.sh

      - name: Run L3 API tests
        # api-smoke.sh：-Papi-test 执行 @Tag("api") 套件（42 用例），目标为 up.sh 起的独立实例。
        # 不加 continue-on-error：L3 失败即为失败，检查结论真实反映质量。
        run: bash scripts/test/api-smoke.sh

      - name: Archive surefire reports
        # 托管 runner 无 full-test.yml 的本地归档限制，用 upload-artifact 归档供失败诊断。
        # always()：L3 失败也归档。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l3-surefire-reports-pr-${{ github.event.pull_request.number }}
          path: continew-tests/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop test environment
        # always()：失败也清理容器与数据卷，防 runner 残留；up 未执行时幂等无害。
        if: always()
        run: bash scripts/test/down.sh
