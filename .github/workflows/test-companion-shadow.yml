name: Test Companion (Shadow)

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**.md'

# 只读 pull_request token 即可列出改动文件，无需 checkout；fork PR 同样适用。
permissions:
  pull-requests: read

# 同 PR 新 push 取消旧 run，避免多份影子信号并存。
concurrency:
  group: test-companion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shadow:
    name: Test companion (shadow)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect changed files
        # 影子阶段：只写 job summary，不评论、不打标签、不 setFailed，不影响合并。
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // open 与 generator 插件已退出测试范围，不参与判定。
            const excluded = /^continew-plugin\/continew-plugin-(open|generator)\//;
            const production = files
              .filter(f => /\/src\/main\/java\/.*\.java$/.test(f.filename))
              .filter(f => !excluded.test(f.filename))
              .map(f => f.filename);
            const tests = files
              .filter(f => /\/src\/test\/java\/.*\.java$/.test(f.filename))
              .filter(f => !excluded.test(f.filename))
              .map(f => f.filename);
            const missing = production.length > 0 && tests.length === 0;

            const lines = [
              '## 测试配套影子检查',
              '',
              `- 生产 Java 改动：${production.length}`,
              `- 测试 Java 改动：${tests.length}`,
              `- 判定：${missing ? '缺少测试配套（仅记录，不影响合并）' : '无需关注'}`,
              '',
            ];
            if (production.length > 0) {
              lines.push('<details><summary>改动的生产文件</summary>', '');
              for (const file of production) {
                lines.push(`- \`${file}\``);
              }
              lines.push('', '</details>', '');
            }
            core.summary.addRaw(lines.join('\n'));
            await core.summary.write();
            core.info(missing
              ? '影子信号：本次生产代码改动没有配套测试改动。'
              : '影子信号：未发现缺少配套测试的生产代码改动。');
