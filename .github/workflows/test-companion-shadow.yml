name: Test Change Advisory

on:
  pull_request:
    branches:
      - dev

# advisory 作业只读 pull_request token 即可列出改动文件，无需 checkout；fork PR 同样适用。
# detect 作业需要 checkout 内容做 diff 判定，按 job 级权限覆盖为 contents: read。
permissions:
  pull-requests: read

# 同 PR 新 push 取消旧 run，避免多份 advisory 结论并存。
concurrency:
  group: test-companion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 工作流级权限仅为 pull-requests: read（供 advisory 作业列 PR 文件），
    # 本作业需要 checkout 仓库内容，按 job 级覆盖
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 改动检测需要 base 提交对象参与 diff，取完整历史
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        # 本工作流仅 pull_request 触发；工作流级不做任何 paths 过滤，
        # 检查分流由 job 级 diff 判定完成（scripts/ci/changed-files.sh -> detect-changes.sh）
        run: bash scripts/ci/changed-files.sh >> "$GITHUB_OUTPUT"

  advisory:
    # job 显示名即分支保护登记的 required check 名，改动需同步仓库设置
    name: Test change advisory
    needs: detect
    # 纯 UI / 纯文档 PR 上中性 Skipped，必需检查（分支保护登记名）不悬空
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect changed files
        # advisory 定位：只写 job summary，不评论、不打标签、不 setFailed，不影响合并。
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // open 与 generator 插件已退出测试范围，不参与判定。
            const excluded = /^continew-plugin\/continew-plugin-(open|generator)\//;
            const production = files
              .filter(f => /\/src\/main\/java\/.*\.java$/.test(f.filename))
              .filter(f => !excluded.test(f.filename))
              .map(f => f.filename);
            const tests = files
              .filter(f => /\/src\/test\/java\/.*\.java$/.test(f.filename))
              .filter(f => !excluded.test(f.filename))
              .map(f => f.filename);
            const missing = production.length > 0 && tests.length === 0;

            const lines = [
              '## 测试配套检查（advisory，不影响合并）',
              '',
              `- 生产 Java 改动：${production.length}`,
              `- 测试 Java 改动：${tests.length}`,
              `- 判定：${missing ? '缺少测试配套' : '无需关注'}`,
              '',
            ];
            if (production.length > 0) {
              lines.push('<details><summary>改动的生产文件</summary>', '');
              for (const file of production) {
                lines.push(`- \`${file}\``);
              }
              lines.push('', '</details>', '');
            }
            core.summary.addRaw(lines.join('\n'));
            await core.summary.write();
            core.info(missing
              ? '本次生产代码改动没有配套测试改动（仅记录，不影响合并）。'
              : '未发现缺少配套测试的生产代码改动。');
