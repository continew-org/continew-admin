name: UI Checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 改动检测需要 base/before 提交对象参与 diff，取完整历史
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        # 工作流级不做任何 paths 过滤：>300 文件时 GitHub 会跳过 paths 匹配，
        # 分流必须由 job 级 diff 判定完成（scripts/ci/changed-files.sh -> detect-changes.sh）
        run: bash scripts/ci/changed-files.sh >> "$GITHUB_OUTPUT"

  checks:
    name: UI checks
    needs: detect
    # 纯后端/纯文档 PR 上中性 Skipped，必需检查（分支保护登记名）不悬空
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: continew-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack and pin pnpm
        # pnpm 版本由 package.json 的 packageManager 字段驱动；
        # -g 安装兜底：setup-node 的缓存探测在仓库根目录执行（无 package.json），
        # 不固定会让其解析到 corepack 内置的旧默认版本，store 路径随 pnpm 大版本漂移导致缓存恒未命中
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          corepack install -g "$(node -p "require('./package.json').packageManager")"
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: continew-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Upload dist artifact
        # dist 仅作为构建产物上传（若需保留失败现场可加 always()），不进缓存、不同步公开网页
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: continew-ui-dist-${{ github.event.pull_request.number || github.sha }}
          path: continew-ui/dist/
          if-no-files-found: error
          retention-days: 14
