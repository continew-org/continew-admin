name: SonarQube

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 改动检测需要 base/before 提交对象参与 diff，取完整历史
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        # 工作流级不做任何 paths 过滤：>300 文件时 GitHub 会跳过 paths 匹配，
        # 检查分流必须由 job 级 diff 判定完成（scripts/ci/changed-files.sh -> detect-changes.sh）
        run: bash scripts/ci/changed-files.sh >> "$GITHUB_OUTPUT"

  build:
    # job 显示名即分支保护登记的 required check 名，改动需同步仓库设置
    name: Sonar analysis
    needs: detect
    # 外部 PR 无权读取 SONAR_TOKEN，跳过避免必红；外部 PR 由 OCR 与人工评审把关，合并后 push 分析兜底
    if: >-
      github.repository == 'continew-org/continew-admin'
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar 需要完整提交历史用于准确分析
          fetch-depth: 0
      - name: Remove repository mirrors
        # POM 中配置的国内镜像仓库在 CI 环境不稳定，构建前移除，改用 Maven Central
        run: |
          sed -i.bak '/<repositories>/,/<\/repositories>/d' pom.xml
          sed -i.bak '/<pluginRepositories>/,/<\/pluginRepositories>/d' pom.xml
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          # 只有 push（dev）写入缓存，PR 与手动触发一律只读，避免每个 PR ref 各存一份
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify -Psonar
