name: OCR Review

# 基于 OpenCodeReview（https://github.com/alibaba/open-code-review）的 PR 自动 AI 评审，
# 与 SonarCloud 静态扫描互补，不作为必需检查。PR 打开/更新/重开时自动评审，
# 维护者在 PR 评论以 '/continew-code-review' 或 '@continew-code-review' 开头可手动全量重审。
#
# 所需凭据（Settings -> Secrets and variables -> Actions）：
#   secret    OCR_LLM_URL             LLM API 端点
#   secret    OCR_LLM_AUTH_TOKEN      LLM API 认证 token
#   secret    OCR_LLM_MODEL           模型名（也可配在 variables，二者皆有时 secrets 优先）
#   secret    OCR_LLM_USE_ANTHROPIC   'true' 走 Anthropic 协议；缺省或其他值走 OpenAI 兼容协议
#   variable  OCR_USE_GITHUB_APP      'true' 时以 GitHub App 身份发布评论
#   secret    CR_BOT_APP_CLIENT_ID    App Client ID（App：OpenContiNew CodeReview Bot）
#   secret    CR_BOT_APP_PRIVATE_KEY  App 私钥（.pem 全文，含首尾标记行）
#                                     App 权限：Pull requests 读写、Contents 只读

# 无关评论进入独立 noop 组，避免取消正在进行的评审
# 注意：触发条件与 job.if 同源，修改时需同步两处
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/continew-code-review')
            || startsWith(github.event.comment.body, '@continew-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target 使 fork PR 也能读取 LLM 密钥；action 只读 diff，不执行 PR 代码
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # ocr 的 npm 启动器会后台自更新（npm i -g 覆盖安装），替换 bin 链接的瞬间
      # /usr/local/bin/ocr 会悬空，同一 job 后续的 ocr 调用直接失败，CI 里必须禁用。
      OCR_NO_UPDATE: '1'
      # 网关把 action 默认的 thinking:disabled 翻成 reasoning_effort="none"，
      # 当前模型不接受该值；显式给值（可选 low/medium/high/xhigh/max）。评审请求与诊断探针共用此值。
      OCR_REASONING_EFFORT: 'medium'
    # 评论触发仅限维护者发送 /continew-code-review 或 @continew-code-review
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/continew-code-review')
          || startsWith(github.event.comment.body, '@continew-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('title', pullRequest.title);

      # 以 GitHub App 身份发布评论；未开启 variable OCR_USE_GITHUB_APP 时跳过
      - name: Get GitHub App token
        id: app-token
        if: ${{ vars.OCR_USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CR_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CR_BOT_APP_PRIVATE_KEY }}

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@8eb83340a487b1150af00701b94f01af97e4b4d6 # v1.13.1
        with:
          ocr_version: '1.13.1'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL || vars.OCR_LLM_MODEL }}
          # 空串会被上游归一化为 anthropic，必须显式给 false 才走 OpenAI 兼容协议
          llm_use_anthropic: ${{ secrets.OCR_LLM_USE_ANTHROPIC || vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
          # 背景上下文传 PR 标题；评论触发事件没有 pull_request 上下文，回退到 pr-context 的解析结果
          background: ${{ github.event.pull_request.title || steps.pr-context.outputs.title }}
          # 开启 App 时为 App installation token，否则回退内置 GITHUB_TOKEN
          github_token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          language: Chinese
          sticky_summary: 'true'
          incremental: 'false'
          llm_extra_body: '{"reasoning_effort": "${{ env.OCR_REASONING_EFFORT }}"}'
          # 失败/取消时也上传原始输出，便于排错
          upload_artifacts: 'true'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      # 评审失败时直接探测 LLM 端点，打印 HTTP 状态与响应体：上游 ocr 只给
      # "provider request failed"，看不到 400 的具体原因。
      - name: Diagnose LLM endpoint
        if: failure()
        shell: bash
        env:
          DIAG_URL: ${{ secrets.OCR_LLM_URL }}
          DIAG_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          DIAG_MODEL: ${{ secrets.OCR_LLM_MODEL || vars.OCR_LLM_MODEL }}
        run: |
          set +e
          # 只打印协议与主机，完整 URL 可能带 query 凭据
          echo "endpoint host: $(printf '%s' "$DIAG_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          echo "model: $DIAG_MODEL"
          probe () {
            local label="$1" extra="$2" code
            code=$(curl -sS -m 60 -o /tmp/llm-probe.txt -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $DIAG_TOKEN" \
              -d "{\"model\":\"$DIAG_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":8${extra}}" \
              "$DIAG_URL")
            echo "--- ${label}: HTTP ${code}"
            head -c 800 /tmp/llm-probe.txt
            echo
          }
          # 裸请求与实际下发参数对照，后者必须与上面的 llm_extra_body 一致
          probe "minimal" ""
          probe "with-reasoning-effort" ",\"reasoning_effort\":\"$OCR_REASONING_EFFORT\""
