name: OCR Review

# Open Code Review（阿里开源 AI 代码评审）：https://github.com/alibaba/open-code-review
# 仅评审 PR diff 并发行内评论 + 摘要评论，与 SonarCloud 静态扫描互补，不做质量门禁（非必需检查）。
#
# 需在 Settings -> Secrets and variables -> Actions 配置：
#   secret    OCR_LLM_URL            LLM API 地址（OpenAI 兼容协议，如 DeepSeek/通义千问）
#   secret    OCR_LLM_AUTH_TOKEN     LLM API Key
#   variable  OCR_LLM_MODEL          模型名称
#   variable  OCR_LLM_USE_ANTHROPIC  使用 Anthropic 协议时为 'true'，OpenAI 兼容协议为 'false'

# PR 事件与 /open-code-review 评论触发共用同一并发组；无关评论进入独立 noop 组，
# 避免一条普通评论取消正在进行的评审。
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # 使用 pull_request_target 以便 fork PR 也能获取 LLM 密钥；
  # action 只读 PR diff，不执行 PR 中的代码。
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR 事件自动评审；评论触发仅限维护者以 /open-code-review 或 @open-code-review 开头，
    # 防止外部用户通过评论消耗 LLM 额度。
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      # issue_comment 事件不含 PR 的 base/head 信息，需先解析
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@8d023aafcec05f8ba5628fca3eaba88078e5d201 # v1.11.1
        with:
          ocr_version: '1.11.1'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          language: Chinese
          # 摘要评论原地更新，不重复刷屏
          sticky_summary: 'true'
          # 已评论过的位置不重复发评论
          incremental: 'true'
          # 重复推送时只评审上次检查点之后的新提交
          checkpoint_range: 'true'
          # 风格/文档类问题交由 Spotless/Checkstyle/Sonar 负责，AI 评论折叠进摘要
          route_categories: style,documentation
          # low 严重度折叠进摘要，行内只保留 medium 及以上
          route_severity_below: low
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
