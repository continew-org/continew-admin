name: Greeting

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

# Issue 和 PR 共用编号；同一条目的欢迎检查与发帖须串行。
concurrency:
  group: greeting-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  welcome:
    name: Greet first-time contributor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # pull_request_target 只使用事件元数据，不检出或执行 PR 代码。
      - name: Greet first-time contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { issue, pull_request: pullRequest } = context.payload;
            const item = pullRequest ?? issue;
            const author = item.user;
            const externalAssociations = ['CONTRIBUTOR', 'FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR', 'NONE'];
            if (author?.type !== 'User' || typeof author.login !== 'string' || !author.login.trim() ||
                !externalAssociations.includes(item.author_association)) {
              return;
            }

            // 此接口同时列出 Issue 和 PR；编号更小的条目才是此事件之前的投稿。
            for await (const { data } of github.paginate.iterator(github.rest.issues.listForRepo, {
              ...context.repo,
              creator: author.login,
              state: 'all',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            })) {
              if (data.some(entry => entry.number < item.number)) {
                return;
              }
            }

            const issueParams = { ...context.repo, issue_number: item.number };
            const marker = '<!-- continew-admin:greeting -->';
            const intro = pullRequest
              ? `🎉 恭喜 @${author.login}，这是您对 ContiNew Admin 仓库的首次贡献！我们衷心感谢您付出的努力。`
              : `🙏 感谢 @${author.login} 向 ContiNew Admin 提交第一个 Issue！我们非常重视每一位用户的反馈，这是推动项目不断进步的动力。`;
            for await (const { data } of github.paginate.iterator(github.rest.issues.listComments, {
              ...issueParams,
              per_page: 100
            })) {
              // 同时识别尚无标记的历史欢迎；外部用户的评论不能阻止欢迎。
              if (data.some(comment => comment.user?.login === 'github-actions[bot]' &&
                  (comment.body?.includes(marker) || comment.body?.startsWith(intro)))) {
                return;
              }
            }

            const message = pullRequest ? [
              '为了保证代码库的完整性和可读性，请您在合并代码之前，确认您的代码符合项目既定的格式规范。关于代码风格和推荐格式化工具的详细指南，请查看仓库中的 [CONTRIBUTING.md](https://github.com/continew-org/continew-admin/blob/dev/CONTRIBUTING.md)。',
              '如有任何疑问，或希望获得更详细的说明，欢迎随时留言交流。此外，诚挚邀请您加入官方交流群，与项目维护团队及其他大佬用户实时交流探讨、获取第一手项目动态（入群方式详见[官网首页](https://continew.top/)）。再次感谢您的宝贵贡献！'
            ] : [
              '为了便于问题的跟进与沉淀，请您确认 Issue 内容符合模板要求（如版本号、复现步骤、期望结果等）。同时，欢迎您将本 Issue 链接分享至官方交流群并 @ 我们，即可与项目维护团队及其他大佬用户直接交流探讨（入群方式详见[官网首页](https://continew.top/)）。再次感谢您的宝贵支持！'
            ];
            await github.rest.issues.createComment({
              ...issueParams,
              body: [intro, ...message, marker].join('\n\n')
            });
