services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - '3306:3306'
    volumes:
      - /docker/mysql/conf/:/etc/mysql/conf.d/
      - /docker/mysql/data/:/var/lib/mysql/
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 你的root用户密码
      # 初始化数据库（后续的初始化 SQL 会在这个库执行）
      MYSQL_DATABASE: continew_admin
      #MYSQL_USER: 你的数据库用户名
      #MYSQL_PASSWORD: 你的数据库密码
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
#  postgresql:
#    image: postgres:14.2
#    container_name: postgresql
#    restart: always
#    ports:
#      - '5432:5432'
#    volumes:
#      - /docker/postgresql/data/:/var/lib/postgresql/data/
#    environment:
#      TZ: Asia/Shanghai
#      POSTGRES_USER: 你的用户名
#      POSTGRES_PASSWORD: 你的用户密码
#      POSTGRES_DB: continew_admin
  redis:
    image: redis:7.2.8
    container_name: redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - '6379:6379'
    volumes:
      - /docker/redis/conf/redis.conf:/usr/local/redis/config/redis.conf
      - /docker/redis/data/:/data/
      - /docker/redis/logs/:/logs/
    environment:
      TZ: Asia/Shanghai
    command: 'redis-server /usr/local/redis/config/redis.conf --appendonly yes'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  continew-server:
    build: ./continew-admin
    image: continew-server:4.2.0-SNAPSHOT
    container_name: continew-server
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - '18000:18000'
      - '17889:17889'
    volumes:
      - /docker/continew-admin/config/:/app/config/
      - /docker/continew-admin/data/file/:/app/data/file/
      - /docker/continew-admin/logs/:/app/logs/
      - /docker/continew-admin/lib/:/app/lib/
    environment:
      TZ: Asia/Shanghai
      PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: 你的数据库用户名
      DB_PWD: 你的数据库密码
      DB_NAME: continew_admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PWD: 你的 Redis 密码
      REDIS_DB: 0
      SCHEDULE_HOST: schedule-server
      SCHEDULE_PORT: 1788
      SCHEDULE_TOKEN: 任务调度服务端 Token
      ACCESS_TOKEN_JWT_SECRET: 你的访问令牌 JWT 密钥（至少 32 字符）
      REFRESH_TOKEN_SECRET: 你的刷新令牌密钥（至少 32 字符，且与前者不同）
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
  continew-web:
    image: nginx:1.27.0
    container_name: continew-web
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - /docker/nginx/cert/:/etc/nginx/cert/
      - /docker/nginx/logs/:/var/log/nginx/
      # 前端页面目录
      - /docker/continew-admin/web/:/usr/share/nginx/html/
    environment:
      TZ: Asia/Shanghai
  schedule-server:
    build: ./schedule-server
    image: schedule-server:1.8.0
    container_name: schedule-server
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - '18001:18001'
      - '17888:17888'
    volumes:
      - /docker/schedule-server/logs/:/app/logs/
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: 你的数据库用户名
      DB_PWD: 你的数据库密码
      DB_NAME: continew_admin_job
    depends_on:
      mysql:
        condition: service_healthy
